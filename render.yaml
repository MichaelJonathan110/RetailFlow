# Render blueprint - one-click backend deploy.
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE: this file only defines the API web service. Create the PostgreSQL
database separately (Neon is recommended for a permanent free tier; Render's
own free Postgres expires after 90 days) and paste its connection string into
the DATABASE_URL env var when Render asks for it.

services:
  - type: web
    name: retailflow-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false            # paste your Neon/Render connection string
      - key: AUTH_ENABLED
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGINS
        sync: false            # e.g. https://retailflow.vercel.app
