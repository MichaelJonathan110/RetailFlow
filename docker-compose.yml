services:
  postgres:
    image: postgres:16-alpine
    container_name: retailflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailflow}
      POSTGRES_USER: ${POSTGRES_USER:-retailflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-dev}
      # Deterministic collation keeps ORDER BY stable across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - retailflow_pgdata:/var/lib/postgresql/data
      # Schema + reference data are applied automatically on a fresh volume.
      - ./database:/retailflow-db:ro
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailflow} -d ${POSTGRES_DB:-retailflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Optional container-first stack: docker compose --profile full up -d --build
  # The documented local flow runs the API and web on the host (scripts/start_demo.cmd).
  api:
    profiles: ["full"]
    build:
      context: ./backend
    container_name: retailflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-retailflow}:${POSTGRES_PASSWORD:-change-me-local-dev}@postgres:5432/${POSTGRES_DB:-retailflow}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${API_PORT:-8020}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:${API_PORT:-8020}/api/v1
    container_name: retailflow-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  retailflow_pgdata:
