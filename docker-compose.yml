services:
  postgres:
    image: postgres:16-alpine
    container_name: retailflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailflow}
      POSTGRES_USER: ${POSTGRES_USER:-retailflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-dev}
      # Deterministic collation keeps ORDER BY stable across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - retailflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailflow} -d ${POSTGRES_DB:-retailflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Optional: the API in a container. The documented local flow runs uvicorn
  # directly on the host; this profile exists for a container-first deployment.
  api:
    profiles: ["full"]
    build:
      context: ./backend
    container_name: retailflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-retailflow}:${POSTGRES_PASSWORD:-change-me-local-dev}@postgres:5432/${POSTGRES_DB:-retailflow}
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${API_PORT:-8020}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  retailflow_pgdata:
